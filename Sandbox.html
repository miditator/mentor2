<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>Песочница: Настройка книги в руках</title>
    <style>
        body { margin: 0; background-color: #1a1a1a; overflow: hidden; color: white; font-family: sans-serif; }
        #info {
            position: absolute; top: 10px; left: 10px;
            background: rgba(0,0,0,0.8); padding: 15px;
            border-radius: 8px; z-index: 10; font-size: 14px; line-height: 1.6;
            box-shadow: 0 4px 6px rgba(0,0,0,0.3);
            pointer-events: none;
        }
        kbd { background: #333; padding: 2px 6px; border-radius: 4px; border: 1px solid #555; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/lil-gui@0.19/dist/lil-gui.umd.min.js"></script>
</head>
<body>
    <div id="info">
        <b>📖 Песочница: Настройка книги</b><br><br>
        <kbd>ЛКМ</kbd> — Вращать камеру<br>
        <kbd>ПКМ</kbd> — Двигать камеру<br>
        <kbd>Колесико</kbd> — Зум<br><br>
        <kbd>TAB</kbd> — Выбрать следующий объект (Робот / Книга)<br>
        <kbd>W</kbd> — Перемещение<br>
        <kbd>E</kbd> — Вращение<br>
        <kbd>R</kbd> — Масштаб<br><br>
        <i>Настрой книгу в руке и открой консоль (F12) за готовым кодом!</i>
    </div>

    <script type="importmap">
        {
            "imports": {
                "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
                "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
            }
        }
    </script>

    <script type="module">
        import * as THREE from 'three';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { TransformControls } from 'three/addons/controls/TransformControls.js';

        const scene = new THREE.Scene();
        const camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 1000);
        camera.position.set(0, 1, 3); // Камера поближе к рукам

        const renderer = new THREE.WebGLRenderer({ antialias: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.PCFSoftShadowMap;
        document.body.appendChild(renderer.domElement);

        const orbitControls = new OrbitControls(camera, renderer.domElement);
        orbitControls.target.set(0, 0.5, 0); // Фокус на уровне груди/рук
        orbitControls.update();

        scene.add(new THREE.AmbientLight(0xffffff, 1.2));
        const dirLight = new THREE.DirectionalLight(0xffffff, 2.5);
        dirLight.position.set(5, 10, 7);
        dirLight.castShadow = true;
        scene.add(dirLight);

        // Вспомогательная сетка на полу
        scene.add(new THREE.GridHelper(10, 10, 0x444444, 0x222222));

        const loader = new GLTFLoader();
        let mixer = null;
        const clock = new THREE.Clock();
        const gui = new lil.GUI({ title: 'Точная настройка' });

        // ==========================================
        // 🎛️ СИСТЕМА МАНИПУЛЯТОРОВ
        // ==========================================
        const transformControl = new TransformControls(camera, renderer.domElement);
        scene.add(transformControl);

        transformControl.addEventListener('dragging-changed', function (event) {
            orbitControls.enabled = !event.value;
        });

        transformControl.addEventListener('mouseUp', () => {
            const obj = transformControl.object;
            if (!obj) return;

            const name = obj.userData.name || 'Объект';
            console.clear();
            console.log(`/* 📍 КООРДИНАТЫ ДЛЯ: ${name} */`);
            console.log(`this.bookMesh.position.set(${obj.position.x.toFixed(3)}, ${obj.position.y.toFixed(3)}, ${obj.position.z.toFixed(3)});`);
            console.log(`this.bookMesh.rotation.set(${obj.rotation.x.toFixed(3)}, ${obj.rotation.y.toFixed(3)}, ${obj.rotation.z.toFixed(3)});`);
            console.log(`this.bookMesh.scale.set(${obj.scale.x.toFixed(3)}, ${obj.scale.y.toFixed(3)}, ${obj.scale.z.toFixed(3)});`);

            gui.controllersRecursive().forEach(c => c.updateDisplay());
        });

        const managedObjects = [];
        let currentObjectIndex = -1;

        function registerObject(obj, name) {
            obj.userData.name = name;
            managedObjects.push(obj);
        }

        function selectObject(index) {
            if (managedObjects.length === 0) return;
            currentObjectIndex = index % managedObjects.length;
            const targetObj = managedObjects[currentObjectIndex];
            transformControl.attach(targetObj);
            console.log(`🎯 Выбран объект: "${targetObj.userData.name}" (Используй W, E, R)`);
        }

        window.addEventListener('keydown', (event) => {
            const key = event.key.toLowerCase();
            if (key === 'tab') {
                event.preventDefault();
                selectObject(currentObjectIndex + 1);
            }
            if (key === 'w') transformControl.setMode('translate');
            if (key === 'e') transformControl.setMode('rotate');
            if (key === 'r') transformControl.setMode('scale');
        });

        function setupGUI(object, folderName) {
            const folder = gui.addFolder(folderName);
            const pF = folder.addFolder('Позиция');
            pF.add(object.position, 'x', -2, 2, 0.001).name('X').listen();
            pF.add(object.position, 'y', -2, 2, 0.001).name('Y').listen();
            pF.add(object.position, 'z', -2, 2, 0.001).name('Z').listen();

            const rF = folder.addFolder('Поворот (Радианы)');
            rF.add(object.rotation, 'x', -Math.PI, Math.PI, 0.01).name('X').listen();
            rF.add(object.rotation, 'y', -Math.PI, Math.PI, 0.01).name('Y').listen();
            rF.add(object.rotation, 'z', -Math.PI, Math.PI, 0.01).name('Z').listen();

            const sF = folder.addFolder('Масштаб');
            sF.add(object.scale, 'x', 0.01, 5, 0.01).name('X').listen();
            sF.add(object.scale, 'y', 0.01, 5, 0.01).name('Y').listen();
            sF.add(object.scale, 'z', 0.01, 5, 0.01).name('Z').listen();
        }

        // ==========================================
        // 📖 ГЕНЕРАТОР ОТКРЫТОЙ КНИГИ
        // ==========================================
        function createOpenBook() {
            const group = new THREE.Group();
            const coverMaterial = new THREE.MeshStandardMaterial({ color: 0x3b5998, roughness: 0.5 });
            const pagesMaterial = new THREE.MeshStandardMaterial({ color: 0xf5f5dc, roughness: 0.9 });

            const cover = new THREE.Mesh(new THREE.BoxGeometry(0.18, 0.008, 0.13), coverMaterial);
            group.add(cover);

            const leftPage = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.006, 0.11), pagesMaterial);
            leftPage.position.set(-0.045, 0.006, 0);
            leftPage.rotation.z = -0.05;
            group.add(leftPage);

            const rightPage = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.006, 0.11), pagesMaterial);
            rightPage.position.set(0.045, 0.006, 0);
            rightPage.rotation.z = 0.05;
            group.add(rightPage);

            return group;
        }

        // ==========================================
        // 🤖 ЗАГРУЗКА РОБОТА И АНИМАЦИИ
        // ==========================================
        loader.load('frontend/models/Idle_Start.glb', (gltf) => {
            const robotModel = gltf.scene;
            scene.add(robotModel);

            // Ищем кость руки
            let handBone = null;
            robotModel.traverse((child) => {
                if (child.isBone) {
                    const name = child.name.toLowerCase();
                    if (name === 'righthand' || name === 'hand_r' || name === 'hand.r' || name === 'mixamorigrighthand') {
                        handBone = child;
                    }
                }
            });

            // Если кость найдена, создаем и прикрепляем книгу
            if (handBone) {
                const bookMesh = createOpenBook();
                // Начальные случайные координаты (подгонишь в песочнице)
                bookMesh.position.set(0.05, 0.03, 0.05);

                handBone.add(bookMesh);

                // Регистрируем книгу в GUI для манипуляций
                registerObject(bookMesh, '📖 Книга (В руке)');
                setupGUI(bookMesh, '📖 Настройки Книги');

                // Сразу выбираем книгу для редактирования
                selectObject(0);
            } else {
                console.warn("⚠️ Кость руки не найдена!");
            }

            // Загружаем анимацию сидения/чтения
            loader.load('frontend/models/chair/chair_loop.glb', (animGltf) => {
                if (animGltf.animations && animGltf.animations.length > 0) {
                    mixer = new THREE.AnimationMixer(robotModel);
                    const action = mixer.clipAction(animGltf.animations[0]);
                    action.setLoop(THREE.LoopRepeat);
                    action.play();
                }
            });
        });

        // ==========================================
        // РЕНДЕР
        // ==========================================
        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        function animate() {
            requestAnimationFrame(animate);
            const delta = clock.getDelta();
            if (mixer) mixer.update(delta);
            orbitControls.update();
            renderer.render(scene, camera);
        }
        animate();
    </script>
</body>
</html>
